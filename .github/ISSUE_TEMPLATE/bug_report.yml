name: Bug report
description: Report a reproducible bug in Minu (not a security vulnerability)
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        **Security issue? Do not open an issue.** Email
        **animesh.aotr@gmail.com** with the subject “Minu security report”.
        See [SECURITY.md](https://github.com/aotr/minu/blob/main/SECURITY.md).

        For normal bugs, include a minimal reproduction and the exact version.
  - type: input
    id: version
    attributes:
      label: Minu version
      description: "`minu@1.6.0`, or the commit SHA if running from source."
      placeholder: "1.6.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 140, Firefox 142, Safari 19…"
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: UMD, ESM, or secure build?
      placeholder: "dist/minu.min.js (UMD)"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: HTML, attributes, server response, and steps to reproduce.
      placeholder: |
        1. Page markup…
        2. Click…
        3. Response body…
      render: html
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include console errors, network status, and the response headers if relevant.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This is not a security vulnerability (those go to email, not issues).
          required: true
        - label: I searched existing issues for the same report.
          required: true
